apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: default
data:
  application.yml: |
    server:
        port: 8080
        protocol: http
    management:
        endpoints:
            web:
                exposure:
                    include: health, info, refresh, env
                base-path: /actuator
        endpoint:
            health:
                show-details: "always"

    logging:
        level:
            root: WARN
            com.example.authservice: TRACE
            org.springframework.security: ERROR
    spring:
        datasource:
            url: ${DATASOURCE_URL}
            username: ${DATASOURCE_USERNAME}
            password: ${DATASOURCE_PASSWORD}
            driver-class-name: org.postgresql.Driver
        jpa:
            show-sql: true
            hibernate:
                ddl-auto: create-drop
            properties:
                hibernate:
                    format_sql: true

        # RabbitMQ settings
        rabbitmq:
            host: ${RABBIT_MQ_HOST}
            port: ${RABBIT_MQ_PORT}
            username: ${RABBIT_MQ_USERNAME}
            password: ${RABBIT_MQ_PASSWORD}
            exchange:
                name: auth-exchange
            routing:
                key: auth.routing.key
            queues: registrationFeedbackQueue, registrationMailQueue
            queue:
                name: auth-queue

        # OAuth2
        security:
            oauth2:
                client:
                    registration:
                        google:
                            client-id: ${GOOGLE_CLIENT_ID}
                            client-secret: ${GOOGLE_SECRET}
                            scope: openid,profile,email
                            redirect-uri: ${GOOGLE_REDIRECT_URI}
                        github:
                            client-id: ${GITHUB_CLIENT_ID}
                            client-secret: ${GITHUB_SECRET}
                            scope: user:email
                            redirect-uri: ${GITHUB_REDIRECT_URI}

    # swagger
    springdoc:
        api-docs:
            enabled: true
            path: ${SWAGGER_API_DOCS}
        swagger-ui:
            enabled: true
            path: ${SWAGGER_UI_PATH}

    auth:
        jwt:
            secret-key: ${AUTH_JWT_SECRET_KEY}