#SA

apiVersion: v1
kind: ServiceAccount
metadata:
    name: auth-service-sa
    namespace: default

---

#RBAC

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: auth-service-role
    namespace: default
rules:
    -   apiGroups: [""]
        resources: ["configmaps", "secrets"]
        verbs: ["get", "list", "watch"]
    # NEW: Required permissions for Spring Cloud Kubernetes service discovery
    -   apiGroups: [""]
        resources: ["services", "endpoints"]
        verbs: ["get", "list", "watch"]
    # NEW: Optional but recommended for pod discovery
    -   apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]

---

#RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: auth-service-rolebinding
    namespace: default
subjects:
    -   kind: ServiceAccount
        name: auth-service-sa
        namespace: default
roleRef:
    kind: Role
    name: auth-service-role
    apiGroup: rbac.authorization.k8s.io